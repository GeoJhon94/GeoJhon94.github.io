<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #grafico { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        //0_6D_ARCOS_ASC_EGMS_L2a_2018_2022_ASC_074_0217_IW1_ARCOS_S1_Ladera_Natural_f_cluster

        if (idParam) {
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/02_FILTER_12D_1-INTER_SMOOTH_ARCOS_DSC/FeatureServer/0";
            const ids = idParam.split(',').map(i => `'${i.trim()}'`).join(',');
            const whereClause = `code_text IN (${ids})`; 
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = "<div style='padding:20px;'>No se encontraron datos.</div>";
                        return;
                    }

                    const traces = [];

                    const clusterColors = {
                        "-1": "gray",
                        "0": "blue",
                        "1": "pink",
                        "2": "green",
                        "3": "orange",
                        "4": "purple",
                        "5": "brown",
                        "6": "black",
                        "7": "cyan",
                        "8": "magenta",
                        "9": "yellow",
                    };

                    const centroids_1 = [];
                    const centroids0 = [-1.06, -1.64, -1.58, -0.95, 0.22, 1.5, 3.09, 4.53, 5.52, 7.25, 8.03, 8.16, 8.61, 9.11, 9.63, 10.85, 11.34, 11.63, 12.43, 12.74, 13.27, 13.98, 14.18, 14.94, 15.38, 15.52, 15.98, 16.34, 16.91, 17.73, 17.9, 18.22, 18.31, 18.41, 18.78, 19.43, 18.8, 18.47, 18.8, 19.58, 20.23, 21.45, 21.1, 21.15, 21.58, 21.96, 22.22, 22.56, 22.52, 22.77, 23.15, 23.64, 23.79, 23.8, 23.5, 23.61, 23.8, 24.13, 24.39, 24.53, 24.36, 24.26, 24.37, 24.46, 24.76, 25.15, 24.72, 25.27, 26.08, 26.39, 26.43, 26.56, 25.8, 26.24, 26.67, 26.88, 27.31, 27.67, 27.52, 27.42, 27.62, 27.86, 28.38, 28.81, 29.05, 29.16, 29.29, 29.4, 29.59, 29.94, 30.09, 30.4, 30.46, 30.28, 30.23, 30.32, 30.06, 30.08, 30.36, 30.33, 30.8, 31.36, 31.58, 31.45, 31.22, 31.18, 31.44, 31.76, 31.95, 31.85, 31.82, 32.31, 32.59, 32.65, 32.74, 32.84, 33.05, 33.44, 33.37, 33.24, 33.2, 33.09, 33.11, 33.61, 33.7, 33.8, 33.68, 33.94, 34.23, 34.87, 35.52, 36.12, 36.09, 36.25, 36.32, 36.05, 36.33, 36.25, 35.9, 35.59, 35.83, 35.97, 36.32, 36.54, 36.52, 36.52, 36.91, 36.62, 35.76, 35.08, 35.29, 37.03];
                    const centroids1 = [-2.68, -0.31, 1.13, 1.6, 0.48, -1.26, -1.32, -0.56, -1.42, -0.82, -2.97, -4.03, -4.4, -5.06, -4.75, -4.66, -4.63, -5.27, -5.91, -7.3, -8.09, -9.08, -7.06, -6.73, -5.77, -4.24, -4.61, -5.78, -6.14, -8.09, -9.08, -8.6, -9.52, -9.3, -7.36, -6.71, -7.12, -7.92, -9.98, -11.17, -9.85, -9.26, -9.29, -9.39, -9.7, -10.49, -10.96, -11.32, -11.24, -11.05, -10.27, -10.13, -10.27, -11.15, -12.1, -13.63, -14.8, -15.86, -15.79, -15.97, -16.49, -17.35, -16.78, -16.61, -16.13, -15.96, -17.05, -17.42, -17.06, -17.01, -16.1, -15.55, -16.9, -17.59, -19.3, -19.9, -19.19, -18.53, -19.24, -19.49, -19.74, -19.26, -18.65, -18.67, -19.05, -19.59, -19.72, -20.17, -20.19, -19.89, -19.45, -19.44, -19.19, -19.85, -20.44, -19.96, -20.23, -20.26, -19.96, -20.45, -21.27, -20.68, -21.88, -22.11, -22.87, -22.83, -23.1, -22.01, -22.04, -22.32, -22.98, -23.41, -23.98, -22.83, -22.29, -22.77, -22.69, -24.18, -24.35, -24.24, -23.78, -23.16, -23.05, -23.36, -23.28, -24.22, -24.75, -24.91, -25.5, -25.15, -25.31, -25.32, -25.41, -25.02, -24.6, -25.03, -26.03, -27.36, -27.54, -27.03, -24.97, -23.82, -24.42, -26.17, -27.05, -26.45, -25.06, -24.8, -26.9, -30.06, -31.41, -28.96];
                    const centroids2 = [];
                    const centroids3 = [];
                    const centroids4 = [];
                    const centroids5 = [];
                    const centroids6 = [];
                    const centroids7 = [];
                    const centroids8 = [];
                    const centroids9 = [];
                    
                    response.features.forEach(feature => {
                    
                        const attrs = feature.attributes;
                    
                        const camposFechas = Object.keys(attrs)
                            .filter(key => key.startsWith('D'));
                    
                        const fechas = camposFechas.map(f => f);
                    
                        const valoresOriginal = camposFechas.map(f => {
                            const num = parseFloat(attrs[f]);
                            return isNaN(num) ? null : num;
                        });
                    
                        const clustering = attrs.CLUSTERING;
                        const colorCluster = clusterColors[clustering?.toString()] || 'black';
                    
                        // 🎯 SERIE ORIGINAL COLOREADA POR CLUSTER
                        traces.push({
                            x: fechas,
                            y: valoresOriginal,
                            name: `${attrs.code_text} (Cluster ${clustering})`,
                            type: 'scatter',
                            mode: 'lines+markers',
                            line: {
                                width: 3,
                                color: "red"
                            }
                        });
                    
                        // 📊 CENTROIDES
                        
                        let centroidesSeleccionados = null;
                    
                        if (clustering === -1) centroidesSeleccionados = centroids_1;
                        if (clustering === 0) centroidesSeleccionados = centroids0;
                        if (clustering === 1) centroidesSeleccionados = centroids1;
                        if (clustering === 2) centroidesSeleccionados = centroids2;
                        if (clustering === 3) centroidesSeleccionados = centroids3;
                        if (clustering === 4) centroidesSeleccionados = centroids4;
                        if (clustering === 5) centroidesSeleccionados = centroids5;
                        if (clustering === 6) centroidesSeleccionados = centroids6;
                        if (clustering === 7) centroidesSeleccionados = centroids7;
                        if (clustering === 8) centroidesSeleccionados = centroids8;
                        if (clustering === 9) centroidesSeleccionados = centroids9;
                    
                        // 🎯 SOLO EL CENTROIDE CORRECTO
                        if (centroidesSeleccionados && centroidesSeleccionados.length > 0) {
                            traces.push({
                                x: fechas,
                                y: centroidesSeleccionados,
                                name: `Centroide Cluster ${clustering}`,
                                type: 'scatter',
                                mode: 'lines',
                                line: {
                                    dash: 'dot',
                                    width: 4,
                                    color: colorCluster
                                },
                                opacity: 0.7
                            });
                        }
                    
                    });

                    // Layaout corregido
                    const layout = {
                        title: {
                            text: 'Series temporales',
                            x: 0.5
                        },
                        xaxis: { type: 'date', title: 'Fecha' },
                        yaxis: { title: 'Desplazamiento (mm)' },
                        hovermode: 'closest',
                    
                        legend: {
                            orientation: 'h',      // horizontal
                            x: 0.5,
                            xanchor: 'center',
                            y: 1.05,               // justo debajo del título
                            yanchor: 'bottom'
                        }
                    };

                    Plotly.newPlot('grafico', traces, layout);
                })
                .catch(err => {
                    document.body.innerHTML = "Error de conexión.";
                });
        }
    </script>
</body>
</html>
