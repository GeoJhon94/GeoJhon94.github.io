<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Series Temporales - ArcGIS</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; }
        #grafico { width: 100%; height: 100vh; }
        .error-msg { padding: 30px; color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; margin: 50px; border-radius: 8px; font-size: 1.1em; line-height: 1.6; }
        code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #d63384; }
    </style>
</head>
<body>
    <div id="grafico"></div>

    <script>
        // 1. Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        // FUNCIÓN AUXILIAR: Convierte textos con comas (ej: "-4,70") a números reales (-4.70)
        const limpiarNumero = (val) => {
            if (val === null || val === undefined) return null;
            let str = val.toString().replace(',', '.').trim();
            let num = parseFloat(str);
            return isNaN(num) ? null : num;
        };

        if (!idParam) {
            document.body.innerHTML = "<div class='error-msg'><strong>Error:</strong> No se detectó un ID.<br>La URL debe ser: <code>...archivo.html?id=TU_CODIGO</code></div>";
        } else {
            // URL del servicio (He puesto la de 6D que es la última que mencionaste)
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/02_FILTER_6D_0-INTER_SMOOTH_ARCOS_ASC/FeatureServer/0";
            
            const whereClause = `code_text = '${idParam.trim()}'`;
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    if (response.error) throw new Error(response.error.message);
                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = `<div class='error-msg'>No se encontró el ID: <code>${idParam}</code> en la columna <b>code_text</b>.</div>`;
                        return;
                    }

                    const traces = [];
                    const clusterColors = {
                        "-1": "gray", "0": "blue", "1": "#FF69B4", "2": "green", "3": "orange",
                        "4": "purple", "5": "brown", "6": "black", "7": "cyan"
                    };

                    // Centroides (Datos de referencia)
                    const allCentroids = {
                        "0": [1.73, 1.73, 1.02, -0.1, -1.05, -2.27, -3.8, -5.52, -7.16, -8.69, -9.81, -10.98, -11.98, -12.65, -12.74, -13.1, -13.66, -14.55, -15.65, -16.33, -16.63, -17.07, -17.08, -16.96, -17.41, -17.79, -18.51, -19.57, -20.06, -20.18, -20.46, -20.62, -20.92, -21.9, -22.56, -22.98, -23.54, -23.84, -24.02, -24.91, -25.42, -25.46, -25.75, -25.91, -26.05, -26.83, -27.19, -27.5, -28.02, -28.44, -28.43, -28.79, -28.69, -28.79, -28.94, -28.95, -28.59, -28.91, -29.04, -29.4, -29.76, -29.9, -29.91, -30.32, -30.59, -30.83, -31.07, -31.16, -31.1, -31.46, -31.75, -32.06, -32.32, -32.79, -32.97, -33.74, -34.17, -34.26, -34.26, -34.23, -34.12, -34.55, -34.85, -34.99, -35.17, -35.05, -35.02, -35.22, -35.47, -35.81, -35.95, -35.97, -36.08, -36.51, -36.92, -37.2, -37.32, -37.63, -37.78, -37.99, -38.12, -38.31, -38.54, -38.8, -38.99, -39.24, -39.44, -39.86, -40.09, -40.23, -40.25, -40.57, -40.53, -40.44, -40.49, -40.46, -40.43, -40.62, -40.56, -40.48, -40.66, -40.67, -40.96, -41.11, -41.26, -41.45, -41.59, -41.69, -41.77, -42.02, -42.54, -42.97, -43.2, -43.2, -43.18, -43.49, -44.01, -44.47, -44.59, -44.59, -44.51, -44.54, -44.51, -44.76, -44.71, -44.79, -44.88, -44.9, -44.88, -44.96, -44.97, -44.87],
                        "1": [3.11, 2.04, 1.27, 0.65, 0.16, -0.88, -2.04, -3.36, -4.65, -5.5, -6.1, -6.66, -7.04, -7.49, -7.79, -8.15, -8.72, -9.13, -10.04, -10.76, -11.14, -11.32, -11.21, -11.17, -11.77, -12.6, -13.34, -13.8, -13.77, -13.74, -13.75, -14.18, -14.47, -15.08, -15.05, -14.96, -15.3, -15.4, -15.75, -16.4, -16.71, -16.6, -16.76, -16.62, -16.52, -16.97, -17.34, -17.53, -18.03, -18.64, -18.53, -19.04, -18.75, -18.65, -18.93, -19.23, -19.39, -19.75, -19.82, -20.01, -20.45, -20.69, -20.8, -20.56, -20.5, -20.38, -20.85, -21.12, -21.23, -21.34, -21.49, -21.81, -22.19, -22.29, -22.42, -22.58, -22.79, -23.39, -23.4, -23.43, -23.36, -23.46, -23.41, -23.78, -23.87, -24.07, -24.36, -24.88, -25.03, -25.21, -25.27, -25.38, -25.35, -25.75, -26.01, -26.17, -26.17, -26.33, -26.53, -27.02, -27.13, -26.98, -26.53, -26.08, -26.27, -26.85, -27.34, -27.78, -27.9, -27.73, -27.79, -28.24, -28.59, -28.69, -28.76, -28.6, -28.75, -29.07, -29.47, -29.62, -29.9, -29.85, -29.91, -29.53, -29.49, -29.49, -29.95, -30.5, -30.79, -30.74, -30.77, -30.54, -30.36, -30.25, -30.14, -30.48, -30.81, -31.11, -31.22, -31.11, -31.04, -31.38, -31.56, -31.93, -32.26, -32.3, -32.4, -32.7, -32.72, -32.91, -33.11, -33.32],
                    };

                    response.features.forEach(feature => {
                        const attrs = feature.attributes;

                        // 1. Identificar y Ordenar columnas D0, D1, D2... (Numérico)
                        const camposD = Object.keys(attrs)
                            .filter(key => /^D\d+$/.test(key))
                            .sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));

                        // 2. Extraer valores limpiando comas (tanto de Y como de CLUSTERING)
                        const valoresY = camposD.map(f => limpiarNumero(attrs[f]));
                        
                        // Limpiar el valor de CLUSTERING por si viene como "1,0"
                        const clusLimpio = limpiarNumero(attrs.CLUSTERING);
                        const clusID = clusLimpio !== null ? clusLimpio.toString() : "-1";

                        // 3. Crear trazado del Punto seleccionado
                        traces.push({
                            x: camposD,
                            y: valoresY,
                            name: `Punto: ${attrs.code_text}`,
                            mode: 'lines+markers',
                            line: { color: 'red', width: 3 },
                            marker: { size: 6 }
                        });

                        // 4. Añadir Centroide del Cluster
                        if (allCentroids[clusID]) {
                            traces.push({
                                x: camposD,
                                y: allCentroids[clusID].slice(0, camposD.length),
                                name: `Centroide Cluster ${clusID}`,
                                mode: 'lines',
                                line: { dash: 'dashdot', color: clusterColors[clusID] || 'black', width: 3 },
                                opacity: 0.6
                            });
                        }
                    });

                    // Configuración Visual del Gráfico
                    const layout = {
                        title: { text: `<b>Análisis Serie Temporal</b><br>ID: ${idParam}`, font: { size: 18 } },
                        xaxis: { title: 'Puntos de Control (Secuencia D)', automargin: true, tickangle: -45 },
                        yaxis: { title: 'Desplazamiento (mm)', gridcolor: '#eee' },
                        hovermode: 'x unified',
                        paper_bgcolor: 'rgba(0,0,0,0)',
                        plot_bgcolor: 'rgba(0,0,0,0)',
                        legend: { orientation: 'h', y: -0.2 }
                    };

                    Plotly.newPlot('grafico', traces, layout);
                })
                .catch(err => {
                    console.error(err);
                    document.body.innerHTML = `<div class='error-msg'>Error crítico: ${err.message}</div>`;
                });
        }
    </script>
</body>
</html>
