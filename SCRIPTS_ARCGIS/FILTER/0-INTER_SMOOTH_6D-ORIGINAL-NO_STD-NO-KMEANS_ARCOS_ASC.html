<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Visualizador</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #grafico { width: 100%; height: 100vh; }
        .error-msg { padding: 20px; color: #721c24; background: #f8d7da; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (!idParam) {
            document.body.innerHTML = "<div class='error-msg'>No hay ID en la URL.</div>";
        } else {
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/02_FILTER_6D_0-INTER_SMOOTH_ARCOS_ASC/FeatureServer/0";
            
            // Usamos decodeURIComponent por si el ID trae caracteres especiales de ArcGIS
            const cleanID = decodeURIComponent(idParam).trim();
            const whereClause = "code_text = '" + cleanID + "'"; 
            const queryUrl = serviceURL + "/query?where=" + encodeURIComponent(whereClause) + "&outFields=*&f=pjson";

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = "<div class='error-msg'>No se encontró el ID: " + cleanID + "</div>";
                        return;
                    }

                    const attrs = response.features[0].attributes;
                    const camposD = Object.keys(attrs)
                        .filter(k => /^D\d+$/.test(k))
                        .sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));

                    // Convertimos valores: si hay coma, la pasamos a punto para que Plotly entienda
                    const valoresY = camposD.map(f => {
                        let v = attrs[f];
                        if (typeof v === 'string') v = v.replace(',', '.');
                        return parseFloat(v);
                    });

                    const traces = [{
                        x: camposD,
                        y: valoresY,
                        name: cleanID,
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: 'red' }
                    }];

                    // Lógica simple para el centroide
                    const clus = attrs.CLUSTERING;
                    // Aquí podrías añadir tus centroides si el gráfico carga...

                    Plotly.newPlot('grafico', traces, { 
                        title: 'Serie Temporal: ' + cleanID,
                        xaxis: { title: 'Secuencia' },
                        yaxis: { title: 'Desplazamiento' }
                    });
                })
                .catch(err => {
                    document.body.innerHTML = "<div class='error-msg'>Error de conexión con el servicio.</div>";
                });
        }
    </script>
</body>
</html>
