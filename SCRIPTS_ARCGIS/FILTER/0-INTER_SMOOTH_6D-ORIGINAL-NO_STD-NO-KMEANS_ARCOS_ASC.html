<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Series Temporales - ArcGIS</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #grafico { width: 100%; height: 100vh; }
        .error-msg { padding: 20px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; margin: 20px; border-radius: 4px; line-height: 1.6; }
        code { background: #eee; padding: 2px 5px; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (!idParam) {
            document.body.innerHTML = "<div class='error-msg'><strong>Error:</strong> No se proporcionó un ID en la URL.<br>Ejemplo: <code>archivo.html?id=TU_ID</code></div>";
        } else {
            // URL DEL SERVICIO (Asegúrate que sea la de 6D o 12D según corresponda)
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/02_FILTER_6D_0-INTER_SMOOTH_ARCOS_ASC/FeatureServer/0";
            
            // Limpiamos el ID de posibles espacios laterales
            const cleanID = idParam.trim();
            const whereClause = `code_text = '${cleanID}'`; 
            
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            console.log("Consultando a ArcGIS:", queryUrl);

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    // Depuración en consola
                    console.log("Respuesta completa de ArcGIS:", response);

                    if (response.error) {
                        document.body.innerHTML = `<div class='error-msg'><strong>Error de ArcGIS:</strong> ${response.error.message}<br>Detalle: ${response.error.details}</div>`;
                        return;
                    }

                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = `
                            <div class='error-msg'>
                                <strong>No se encontraron datos.</strong><br>
                                El ID <code>${cleanID}</code> no existe en la columna <code>code_text</code>.<br>

                            </div>`;
                        return;
                    }

                    const traces = [];
                    const clusterColors = {
                        "-1": "gray", "0": "blue", "1": "pink", "2": "green", "3": "orange",
                        "4": "purple", "5": "brown", "6": "black", "7": "cyan", "8": "magenta", "9": "yellow"
                    };

                    // Centroides (He dejado los que pasaste, se adaptarán al número de columnas D que existan)

                        "1": [3.11, 2.04, 1.27, 0.65, 0.16, -0.88, -2.04, -3.36, -4.65, -5.5, -6.1, -6.66, -7.04, -7.49, -7.79, -8.15, -8.72, -9.13, -10.04, -10.76, -11.14, -11.32, -11.21, -11.17, -11.77, -12.6, -13.34, -13.8, -13.77, -13.74, -13.75, -14.18, -14.47, -15.08, -15.05, -14.96, -15.3, -15.4, -15.75, -16.4, -16.71, -16.6, -16.76, -16.62, -16.52, -16.97, -17.34, -17.53, -18.03, -18.64, -18.53, -19.04, -18.75, -18.65, -18.93, -19.23, -19.39, -19.75, -19.82, -20.01, -20.45, -20.69, -20.8, -20.56, -20.5, -20.38, -20.85, -21.12, -21.23, -21.34, -21.49, -21.81, -22.19, -22.29, -22.42, -22.58, -22.79, -23.39, -23.4, -23.43, -23.36, -23.46, -23.41, -23.78, -23.87, -24.07, -24.36, -24.88, -25.03, -25.21, -25.27, -25.38, -25.35, -25.75, -26.01, -26.17, -26.17, -26.33, -26.53, -27.02, -27.13, -26.98, -26.53, -26.08, -26.27, -26.85, -27.34, -27.78, -27.9, -27.73, -27.79, -28.24, -28.59, -28.69, -28.76, -28.6, -28.75, -29.07, -29.47, -29.62, -29.9, -29.85, -29.91, -29.53, -29.49, -29.49, -29.95, -30.5, -30.79, -30.74, -30.77, -30.54, -30.36, -30.25, -30.14, -30.48, -30.81, -31.11, -31.22, -31.11, -31.04, -31.38, -31.56, -31.93, -32.26, -32.3, -32.4, -32.7, -32.72, -32.91, -33.11, -33.32],
                        "2": [2.03, 1.29, 0.71, 0.14, -0.46, -1.63, -2.79, -4.25, -5.82, -6.83, -7.68, -8.38, -8.84, -9.44, -9.67, -9.92, -10.36, -10.93, -12.12, -12.93, -13.25, -13.41, -13.1, -13.11, -13.73, -14.22, -14.85, -15.45, -15.7, -16.12, -16.48, -16.6, -16.69, -17.07, -17.17, -17.29, -17.93, -18.06, -18.45, -19.19, -19.7, -19.76, -20.01, -19.86, -19.9, -20.39, -20.93, -21.16, -21.62, -22.01, -21.87, -22.14, -21.98, -21.95, -22.31, -22.6, -22.7, -23.22, -23.33, -23.5, -23.93, -23.92, -23.92, -24.08, -24.2, -24.18, -24.57, -24.51, -24.31, -24.47, -24.66, -25.0, -25.29, -25.7, -25.64, -26.03, -26.28, -26.83, -26.92, -27.07, -26.9, -27.07, -27.07, -27.39, -27.59, -27.63, -27.81, -27.95, -27.98, -28.02, -28.0, -28.08, -28.19, -28.56, -28.98, -29.14, -29.06, -29.49, -29.73, -30.14, -30.18, -29.92, -29.6, -29.52, -29.76, -30.24, -30.59, -30.94, -31.18, -31.13, -31.2, -31.45, -31.52, -31.33, -31.35, -31.28, -31.5, -31.76, -32.16, -32.24, -32.27, -32.07, -32.17, -31.92, -32.12, -32.14, -32.24, -32.27, -32.34, -32.43, -32.74, -32.85, -32.93, -33.02, -33.05, -33.49, -33.83, -34.16, -34.34, -34.47, -34.3, -34.53, -34.49, -34.62, -34.79, -34.79, -34.83, -35.1, -34.96, -34.87, -35.02, -35.58],
                    };

                    response.features.forEach(feature => {
                        const attrs = feature.attributes;

                        // Extraer y ordenar columnas D0, D1, D2...
                        const camposD = Object.keys(attrs)
                            .filter(key => /^D\d+$/.test(key))
                            .sort((a, b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));

                        const valoresY = camposD.map(f => attrs[f]);

                        // Añadir línea del punto
                        traces.push({
                            x: camposD,
                            y: valoresY,
                            name: `ID: ${attrs.code_text}`,
                            mode: 'lines+markers',
                            line: {color: 'red', width: 2}
                        });

                        // Añadir centroide si existe el cluster
                        const clus = attrs.CLUSTERING;
                        if (allCentroids[clus]) {
                            traces.push({
                                x: camposD,
                                y: allCentroids[clus].slice(0, camposD.length),
                                name: `Centroide Cluster ${clus}`,
                                mode: 'lines',
                                line: {dash: 'dashdot', color: clusterColors[clus] || 'black', width: 3}
                            });
                        }
                    });

                    Plotly.newPlot('grafico', traces, {
                        title: `Serie Temporal - ${idParam}`,
                        xaxis: { title: 'Días / Puntos (Secuencia D)' },
                        yaxis: { title: 'Valor' }
                    });
                })
                .catch(err => {
                    console.error("Error en Fetch:", err);
                    document.body.innerHTML = "<div class='error-msg'>Error de conexión. Revisa la consola (F12).</div>";
                });
        }
    </script>
</body>
</html>
</html>
