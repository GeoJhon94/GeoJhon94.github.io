<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #grafico { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (idParam) {
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/01_NON_FILTER_12D_3_INTER_SMOOTH_ARCOS_DSC/FeatureServer/0";
            const ids = idParam.split(',').map(i => `'${i.trim()}'`).join(',');
            const whereClause = `code_text IN (${ids})`; 
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = "<div style='padding:20px;'>No se encontraron datos.</div>";
                        return;
                    }

                    const traces = [];

                    const clusterColors = {
                        "-1": "gray",
                        "0": "blue",
                        "1": "pink",
                        "2": "green",
                        "3": "orange",
                        "4": "purple",
                        "5": "brown",
                        "6": "black",
                        "7": "cyan",
                        "8": "magenta",
                        "9": "yellow",
                    };

                    const centroids_1 = [];
                    const centroids0 = [-0.97, -1.68, -1.64, -0.99, 0.2, 1.52, 3.15, 4.72, 5.87, 7.67, 8.48, 8.57, 9.04, 9.56, 10.19, 11.51, 12.09, 12.36, 13.14, 13.41, 13.91, 14.62, 14.81, 15.54, 15.89, 16.0, 16.48, 16.85, 17.49, 18.35, 18.49, 18.86, 19.0, 19.1, 19.56, 20.2, 19.48, 19.13, 19.5, 20.25, 21.02, 22.31, 21.97, 21.99, 22.46, 22.72, 23.02, 23.38, 23.38, 23.56, 23.87, 24.26, 24.33, 24.28, 24.01, 24.11, 24.34, 24.72, 24.96, 25.02, 24.87, 24.75, 24.91, 25.07, 25.43, 25.8, 25.4, 25.96, 26.73, 26.97, 26.98, 27.07, 26.32, 26.85, 27.3, 27.51, 27.95, 28.28, 28.06, 27.97, 28.2, 28.46, 28.99, 29.38, 29.55, 29.64, 29.77, 29.8, 29.97, 30.3, 30.45, 30.78, 30.83, 30.61, 30.53, 30.65, 30.43, 30.49, 30.74, 30.71, 31.11, 31.69, 31.89, 31.71, 31.48, 31.5, 31.79, 32.19, 32.33, 32.19, 32.14, 32.61, 32.87, 32.97, 33.03, 33.11, 33.29, 33.62, 33.55, 33.42, 33.33, 33.18, 33.21, 33.76, 33.88, 33.97, 33.85, 34.14, 34.47, 35.17, 35.81, 36.45, 36.46, 36.65, 36.73, 36.43, 36.71, 36.69, 36.35, 36.08, 36.35, 36.42, 36.72, 36.87, 36.74, 36.75, 37.15, 36.87, 36.04, 35.36, 35.59, 37.38];
                    const centroids1 = [-0.77, -1.15, -1.02, -0.57, -0.04, 0.3, 0.71, 0.92, 1.16, 1.92, 2.24, 2.09, 2.18, 2.19, 2.5, 3.07, 3.33, 3.36, 3.72, 3.51, 3.78, 3.92, 4.07, 4.52, 4.55, 4.27, 4.43, 4.3, 4.45, 4.89, 4.81, 4.86, 4.93, 4.83, 4.87, 5.22, 4.64, 4.13, 4.22, 4.69, 5.15, 5.93, 5.56, 5.39, 5.41, 5.49, 5.39, 5.46, 5.39, 5.61, 5.72, 5.93, 5.91, 5.92, 5.79, 5.73, 5.79, 5.92, 6.05, 6.16, 6.09, 5.78, 5.76, 5.86, 6.07, 6.3, 6.17, 6.07, 6.13, 6.28, 6.39, 6.55, 6.29, 6.35, 6.35, 6.54, 6.83, 7.03, 6.87, 6.75, 6.83, 7.03, 7.42, 7.52, 7.45, 7.24, 7.43, 7.36, 7.52, 7.66, 7.76, 7.69, 7.62, 7.14, 6.93, 7.02, 7.03, 7.17, 7.12, 6.93, 7.1, 7.59, 7.79, 7.89, 7.68, 7.49, 7.6, 7.92, 8.09, 8.03, 7.97, 8.13, 8.21, 8.27, 8.31, 8.2, 8.33, 8.48, 8.56, 8.41, 8.24, 8.05, 8.03, 8.13, 8.27, 8.26, 8.08, 8.07, 8.12, 8.47, 9.1, 9.97, 10.09, 10.05, 9.79, 9.16, 9.11, 9.01, 8.82, 8.79, 9.14, 9.26, 9.53, 9.49, 9.25, 9.39, 9.75, 9.35, 8.33, 7.14, 7.11, 9.26];
                    const centroids2 = [];
                    const centroids3 = [];
                    const centroids4 = [];
                    const centroids5 = [];
                    const centroids6 = [];
                    const centroids7 = [];
                    const centroids8 = [];
                    const centroids9 = [];
                    
                    response.features.forEach(feature => {
                    
                        const attrs = feature.attributes;
                    
                        const camposFechas = Object.keys(attrs)
                            .filter(key => key.startsWith('D'))
                            .sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

                        const fechas = camposFechas;

                        const valoresOriginal = camposFechas.map(f => {
                            const num = parseFloat(attrs[f]?.toString().replace(',', '.'));
                            return isNaN(num) ? null : num;
                        });

                        const clustering = parseInt(attrs.CLUSTERING?.toString().replace(',', '.'));
                        const colorCluster = clusterColors[clustering?.toString()] || 'black';

                        traces.push({
                            x: fechas,
                            y: valoresOriginal,
                            name: `${attrs.code_text} (Cluster ${clustering})`,
                            type: 'scatter',
                            mode: 'lines+markers',
                            line: {
                                width: 3,
                                color: "red"
                            }
                        });
                    
                        let centroidesSeleccionados = null;
                    
                        if (clustering === -1) centroidesSeleccionados = centroids_1;
                        if (clustering === 0) centroidesSeleccionados = centroids0;
                        if (clustering === 1) centroidesSeleccionados = centroids1;
                        if (clustering === 2) centroidesSeleccionados = centroids2;
                        if (clustering === 3) centroidesSeleccionados = centroids3;
                        if (clustering === 4) centroidesSeleccionados = centroids4;
                        if (clustering === 5) centroidesSeleccionados = centroids5;
                        if (clustering === 6) centroidesSeleccionados = centroids6;
                        if (clustering === 7) centroidesSeleccionados = centroids7;
                        if (clustering === 8) centroidesSeleccionados = centroids8;
                        if (clustering === 9) centroidesSeleccionados = centroids9;
                    
                        if (centroidesSeleccionados && centroidesSeleccionados.length > 0) {
                            traces.push({
                                x: fechas,
                                y: centroidesSeleccionados,
                                name: `Centroide Cluster ${clustering}`,
                                type: 'scatter',
                                mode: 'lines',
                                line: {
                                    dash: 'dot',
                                    width: 4,
                                    color: colorCluster
                                },
                                opacity: 0.7
                            });
                        }
                    
                    });

                    const layout = {
                        title: {
                            text: 'Series temporales',
                            x: 0.5
                        },
                        xaxis: { title: 'Tiempo (D)' },
                        yaxis: { title: 'Desplazamiento (mm)' },
                        hovermode: 'closest',
                        legend: {
                            orientation: 'h',
                            x: 0.5,
                            xanchor: 'center',
                            y: 1.05,
                            yanchor: 'bottom'
                        }
                    };

                    Plotly.newPlot('grafico', traces, layout);
                })
                .catch(err => {
                    document.body.innerHTML = "Error de conexión.";
                });
        }
    </script>
</body>
</html>
