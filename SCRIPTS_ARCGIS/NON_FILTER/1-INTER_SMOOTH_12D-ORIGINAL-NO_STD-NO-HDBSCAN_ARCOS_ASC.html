<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #grafico { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (idParam) {
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/01_NON_FILTER_12D_1_INTER_SMOOTH_ARCOS_ASC/FeatureServer/0";
            const ids = idParam.split(',').map(i => `'${i.trim()}'`).join(',');
            const whereClause = `code_text IN (${ids})`; 
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {

                    }

                    const centroids0 = [0.05, -0.46, -0.59, -0.46, -0.08, 0.29, 0.36, 0.38, 0.36, 0.34, 0.33, 0.45, 0.29, 0.12, 0.24, 0.03, -0.21, -0.29, -0.54, -0.96, -1.18, -1.25, -0.95, -0.53, -0.22, -0.38, -0.54, -0.68, -0.61, -0.49, -0.48, -0.65, -0.72, -0.99, -0.79, -0.58, -0.71, -0.69, -0.8, -0.98, -1.02, -0.99, -1.21, -1.17, -1.12, -1.2, -1.48, -1.58, -2.02, -2.23, -1.88, -1.94, -1.59, -1.26, -1.48, -1.69, -1.55, -1.82, -1.62, -1.51, -1.83, -2.05, -1.78, -1.59, -1.57, -1.51, -1.82, -1.95, -1.79, -1.57, -1.63, -1.81, -1.66, -1.62, -1.99, -2.25, -2.8, -3.44, -2.91, -2.28, -2.29, -2.1, -2.14, -2.33, -2.09, -1.89, -1.97, -1.82, -1.55, -1.55, -1.68, -1.82, -1.78, -1.86, -1.56, -1.33, -1.27, -1.37, -1.64, -1.92, -1.81, -1.39, -1.2, -1.08, -1.56, -2.09, -2.33, -2.38, -2.51, -2.41, -2.57, -2.7, -2.52, -2.24, -2.13, -2.39, -2.43, -2.58, -2.88, -3.01, -2.9, -2.9, -2.6, -2.3, -2.31, -2.3, -2.16, -2.21, -2.3, -2.24, -2.29, -2.36, -2.19, -2.07, -1.81, -1.97, -2.09, -2.36, -2.84, -3.12, -3.11, -3.27, -2.75, -2.29, -2.27, -2.34, -2.72, -3.1, -3.01, -2.74, -2.51, -2.46];
                    const centroids1 = [2.37, 1.94, 1.41, 0.75, -0.04, -1.3, -2.67, -4.21, -5.49, -6.48, -7.24, -7.95, -8.45, -8.94, -9.13, -9.42, -9.83, -10.25, -11.11, -11.78, -12.15, -12.39, -12.29, -12.24, -12.79, -13.36, -13.98, -14.56, -14.73, -14.83, -14.98, -15.14, -15.36, -15.86, -16.0, -16.05, -16.5, -16.59, -16.91, -17.52, -17.9, -17.86, -18.1, -18.0, -17.96, -18.39, -18.75, -18.97, -19.45, -19.89, -19.75, -20.04, -19.88, -19.8, -19.97, -20.09, -20.05, -20.4, -20.54, -20.77, -21.18, -21.34, -21.33, -21.28, -21.22, -21.2, -21.59, -21.74, -21.71, -21.93, -22.13, -22.55, -22.79, -22.93, -22.8, -23.08, -23.39, -23.92, -23.89, -23.81, -23.52, -23.56, -23.72, -24.07, -24.19, -24.15, -24.15, -24.27, -24.4, -24.62, -24.78, -24.93, -24.98, -25.29, -25.41, -25.43, -25.44, -25.75, -25.95, -26.3, -26.31, -26.16, -26.05, -26.06, -26.28, -26.7, -26.99, -27.27, -27.42, -27.4, -27.53, -27.83, -27.88, -27.69, -27.57, -27.47, -27.6, -27.8, -27.98, -28.01, -28.15, -28.12, -28.24, -28.07, -28.08, -28.14, -28.39, -28.65, -28.85, -28.99, -29.2, -29.21, -29.19, -29.13, -29.07, -29.42, -29.82, -30.14, -30.35, -30.33, -30.27, -30.5, -30.43, -30.5, -30.63, -30.61, -30.81, -31.07, -31.06, -31.1, -31.21, -31.43];
                    const centroids2 = [];
                    const centroids3 = [];
                    const centroids4 = [];
                    const centroids5 = [];
                    const centroids6 = [];
                    const centroids7 = [];
                    const centroids8 = [];
                    const centroids9 = [];
                    
                    response.features.forEach(feature => {
                    
                        const attrs = feature.attributes;
                    
                        const camposFechas = Object.keys(attrs)
                            .filter(key => key.startsWith('D'))
                            .sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

                        const fechas = camposFechas;

                        const valoresOriginal = camposFechas.map(f => {
                            const num = parseFloat(attrs[f]?.toString().replace(',', '.'));
                            return isNaN(num) ? null : num;
                        });

                        const clustering = parseInt(attrs.CLUSTERING?.toString().replace(',', '.'));
                        const colorCluster = clusterColors[clustering?.toString()] || 'black';

                        traces.push({
                            x: fechas,
                            y: valoresOriginal,
                            name: `${attrs.code_text} (Cluster ${clustering})`,
                            type: 'scatter',
                            mode: 'lines+markers',
                            line: {
                                width: 3,
                                color: "red"
                            }
                        });
                    
                        let centroidesSeleccionados = null;
                    
                        if (clustering === -1) centroidesSeleccionados = centroids_1;
                        if (clustering === 0) centroidesSeleccionados = centroids0;
                        if (clustering === 1) centroidesSeleccionados = centroids1;
                        if (clustering === 2) centroidesSeleccionados = centroids2;
                        if (clustering === 3) centroidesSeleccionados = centroids3;
                        if (clustering === 4) centroidesSeleccionados = centroids4;
                        if (clustering === 5) centroidesSeleccionados = centroids5;
                        if (clustering === 6) centroidesSeleccionados = centroids6;
                        if (clustering === 7) centroidesSeleccionados = centroids7;
                        if (clustering === 8) centroidesSeleccionados = centroids8;
                        if (clustering === 9) centroidesSeleccionados = centroids9;
                    
                        if (centroidesSeleccionados && centroidesSeleccionados.length > 0) {
                            traces.push({
                                x: fechas,
                                y: centroidesSeleccionados,
                                name: `Centroide Cluster ${clustering}`,
                                type: 'scatter',
                                mode: 'lines',
                                line: {
                                    dash: 'dot',
                                    width: 4,
                                    color: colorCluster
                                },
                                opacity: 0.7
                            });
                        }
                    
                    });

                    const layout = {
                        title: {
                            text: 'Series temporales',
                            x: 0.5
                        },
                        xaxis: { title: 'Tiempo (D)' },
                        yaxis: { title: 'Desplazamiento (mm)' },
                        hovermode: 'closest',
                        legend: {
                            orientation: 'h',
                            x: 0.5,
                            xanchor: 'center',
                            y: 1.05,
                            yanchor: 'bottom'
                        }
                    };

                    Plotly.newPlot('grafico', traces, layout);
                })
                .catch(err => {
                    document.body.innerHTML = "Error de conexión.";
                });

</body>
</html>
