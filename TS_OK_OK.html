<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #grafico { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="grafico"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (idParam) {
            const serviceURL = "https://services-eu1.arcgis.com/WCEIifo5j3luTcRc/arcgis/rest/services/_12D/FeatureServer/0";
            const ids = idParam.split(',').map(i => `'${i.trim()}'`).join(',');
            const whereClause = `code_text IN (${ids})`; 
            const queryUrl = `${serviceURL}/query?where=${encodeURIComponent(whereClause)}&outFields=*&f=pjson`;

            fetch(queryUrl)
                .then(res => res.json())
                .then(response => {
                    if (!response.features || response.features.length === 0) {
                        document.body.innerHTML = "<div style='padding:20px;'>No se encontraron datos. Revisa si el campo se llama 'code_text'.</div>";
                        return;
                    }

                    const traces = response.features.map(feature => {
                        const attrs = feature.attributes;
                        
                        // Filtrar columnas que empiecen por D
                        const camposFechas = Object.keys(attrs)
                            .filter(key => key.startsWith('D'))
                            .sort();

                        const valoresY = camposFechas.map(f => {
                            let rawVal = attrs[f];
                            // CORRECCIÓN DE COMA A PUNTO
                            if (typeof rawVal === 'string') {
                                rawVal = rawVal.replace(',', '.');
                            }
                            let val = parseFloat(rawVal);
                            return isNaN(val) ? null : val;
                        });

                        const objetosFecha = camposFechas.map(f => {
                            let s = f.replace('D', '');
                            return `${s.substring(0,4)}-${s.substring(4,6)}-${s.substring(6,8)}`;
                        });

                        return {
                            x: objetosFecha,
                            y: valoresY,
                            name: attrs.code_text,
                            type: 'scatter',
                            mode: 'lines+markers',
                            line: { width: 2 }
                        };
                    });

                    const layout = {
                        title: attrs.id,
                        xaxis: { type: 'date', title: 'Fecha' },
                        yaxis: { title: 'Desplazamiento (mm)' },
                        hovermode: 'closest'
                    };

                    Plotly.newPlot('grafico', traces, layout);
                })
                .catch(err => {
                    document.body.innerHTML = "Error de conexión.";
                });
        }
    </script>
</body>
</html>
